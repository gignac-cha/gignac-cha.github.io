<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#101617" />
    <title>Prism Garden</title>
    <link rel="stylesheet" href="style.css" />
    <script type="module" src="script.js"></script>
    <script>
      try {
        localStorage.setItem('footprint:endpoint', 'https://footprint-trail.tes-cha.workers.dev/');
      } catch {}
    </script>
    <script type="module" src="https://fastly.jsdelivr.net/npm/@tes.cha/footprint/footprint.bundle.js"></script>
  </head>
  <body>
    <div class="study">
      <header class="study-header">
        <div class="study-identity">
          <div class="study-eyebrow"><a href="../index.html">TEST ASTRA</a> / 004</div>
          <h1>Prism Garden</h1>
          <p>One light, many directions.</p>
        </div>
        <div class="study-actions" role="group" aria-label="Scene actions">
          <button class="tool" id="play" aria-label="Pause" data-tip="Pause" data-icon="pause"></button>
          <button class="tool" id="reset" aria-label="Reset arrangement" data-tip="Reset arrangement" data-icon="rotate-ccw"></button>
          <button class="tool" id="save" aria-label="Save image" data-tip="Save image" data-icon="download"></button>
          <button class="tool" id="fullscreen" aria-label="Fullscreen" data-tip="Fullscreen" data-icon="maximize"></button>
        </div>
      </header>
      <main class="study-stage" id="stage">
        <canvas id="canvas" tabindex="0" aria-label="Interactive glass prisms and refracted light"></canvas>
        <div class="study-stats"><span>REFRACTION / DISPERSION</span><span>380 - 700 nm</span></div>
        <div class="study-readout"><span id="readout">PRISM 01</span><span id="ray-count">07 RAYS</span></div>
        <p id="notice" class="study-notice" role="status"></p>
      </main>
      <footer class="study-controls">
        <fieldset class="control">
          <legend>MODE</legend>
          <div class="segments">
            <label><input name="mode" type="radio" value="place" checked /><span>Arrange</span></label
            ><label><input name="mode" type="radio" value="orbit" /><span>Orbit</span></label>
          </div>
        </fieldset>
        <div class="control">
          <label class="control-label" for="selected">PRISM</label
          ><select id="selected">
            <option value="0">01 / Tall</option>
            <option value="1">02 / Broad</option>
            <option value="2">03 / Small</option>
          </select>
        </div>
        <div class="control">
          <label class="control-label" for="angle">ANGLE <output id="angle-value">20°</output></label
          ><input id="angle" type="range" min="-180" max="180" value="20" />
        </div>
        <div class="control">
          <label class="control-label" for="dispersion">DISPERSION <output id="dispersion-value">65</output></label
          ><input id="dispersion" type="range" min="0" max="100" value="65" />
        </div>
        <div class="control">
          <label class="control-label" for="refraction">REFRACTION <output id="refraction-value">1.52</output></label
          ><input id="refraction" type="range" min="130" max="180" value="152" />
        </div>
      </footer>
      <div class="colophon"><span>LIGHT THROUGH MATTER</span><span>PRISM GARDEN / 2026</span></div>
    </div>
  </body>
</html>
