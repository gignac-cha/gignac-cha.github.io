<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#e5e9e7">
    <meta name="description" content="Tidal Form. A kinetic sculpture in forty-eight floating layers.">
    <title>Tidal Form</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23e5e9e7'/%3E%3Ctext x='9' y='26' fill='%23354042' font-family='Georgia' font-size='30' font-style='italic'%3Et%3C/text%3E%3C/svg%3E">
    <link rel="stylesheet" href="style.css">
    <script type="module" src="script.js"></script>
    <script>try { localStorage.setItem('footprint:endpoint', 'https://footprint-trail.tes-cha.workers.dev/'); } catch {}</script>
    <script type="module" src="https://fastly.jsdelivr.net/npm/@tes.cha/footprint/footprint.bundle.js"></script>
  </head>
  <body>
    <div class="page">
      <header>
        <div class="identity"><span class="eyebrow">FIELD NOTES / 003</span><h1>Tidal Form<span>.</span></h1><p>Held together by motion.</p></div>
        <div class="header-right">
          <div class="status"><i></i><output id="play-state">IN MOTION</output></div>
          <div class="actions" role="group" aria-label="Sculpture controls">
            <button id="play" class="icon" aria-label="Pause" data-tip="Pause" data-icon="pause"></button>
            <button id="pulse" class="icon" aria-label="Send an impulse" data-tip="Send an impulse" data-icon="shuffle"></button>
            <button id="reset" class="icon" aria-label="Reset view" data-tip="Reset view" data-icon="rotate-ccw"></button>
            <i class="separator" aria-hidden="true"></i>
            <button id="save" class="icon" aria-label="Save image" data-tip="Save image" data-icon="download"></button>
            <button id="fullscreen" class="icon" aria-label="Fullscreen" data-tip="Fullscreen" data-icon="maximize"></button>
          </div>
        </div>
      </header>

      <main id="stage" aria-label="Interactive three-dimensional sculpture">
        <canvas id="canvas" tabindex="0" aria-label="Tidal Form sculpture" aria-keyshortcuts="ArrowUp ArrowDown ArrowLeft ArrowRight + -"></canvas>
        <div class="scene-top" aria-hidden="true"><span>FORTY-EIGHT LAYERS</span><span id="object-name">01 / SPINDLE</span></div>
        <div class="scene-bottom" aria-hidden="true"><span id="selection">OBJECT / 003</span><span id="elapsed">00:00.0</span></div>
        <p id="notice" role="status"></p>
        <noscript><p class="error">JavaScript is required to render the sculpture.</p></noscript>
      </main>

      <footer class="controls">
        <fieldset class="form-group"><legend>FORM</legend><div class="segments">
          <label><input type="radio" name="form" value="0" checked><span>Spindle</span></label>
          <label><input type="radio" name="form" value="1"><span>Vessel</span></label>
          <label><input type="radio" name="form" value="2"><span>Halo</span></label>
        </div></fieldset>
        <div class="range-group"><label for="openness">EXPANSION <output id="openness-value">16%</output></label><input id="openness" type="range" min="0" max="100" value="16"></div>
        <div class="range-group"><label for="twist">TWIST <output id="twist-value">105&#176;</output></label><input id="twist" type="range" min="-180" max="180" value="105"></div>
        <fieldset class="finish-group"><legend>FINISH</legend><div class="finishes">
          <label class="finish alloy" data-tip="Alloy"><input type="radio" name="finish" value="0" aria-label="Alloy finish" checked><span></span></label>
          <label class="finish porcelain" data-tip="Porcelain"><input type="radio" name="finish" value="1" aria-label="Porcelain finish"><span></span></label>
          <label class="finish patina" data-tip="Patina"><input type="radio" name="finish" value="2" aria-label="Patina finish"><span></span></label>
        </div></fieldset>
        <label class="toggle"><span>ROTATION</span><input id="turn" type="checkbox" role="switch" checked><i aria-hidden="true"></i></label>
      </footer>
      <div class="colophon"><span>A STUDY OF FORM &amp; RESPONSE</span><span>TIDAL FORM / 2026</span></div>
    </div>
  </body>
</html>
