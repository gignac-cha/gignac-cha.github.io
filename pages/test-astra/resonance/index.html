<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0b0e10">
    <meta name="description" content="Resonance. An interactive study of waves and interference.">
    <title>Resonance</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230b0e10'/%3E%3Ctext x='7' y='25' fill='%23ecf0e8' font-family='Georgia' font-size='27' font-style='italic'%3Er%3C/text%3E%3C/svg%3E">
    <link rel="stylesheet" href="style.css">
    <script type="module" src="script.js"></script>
    <script>try { localStorage.setItem('footprint:endpoint', 'https://footprint-trail.tes-cha.workers.dev/'); } catch {}</script>
    <script type="module" src="https://fastly.jsdelivr.net/npm/@tes.cha/footprint/footprint.bundle.js"></script>
  </head>
  <body>
    <div class="experiment">
      <header class="header">
        <div class="identity">
          <div class="eyebrow">FIELD NOTES / 001</div>
          <h1>Resonance<span class="title-period">.</span></h1>
          <p>Waves in conversation</p>
        </div>
        <div class="header-tools">
          <span class="live-status"><span class="status-light"></span><span id="play-state">LIVE</span></span>
          <div class="actions" role="group" aria-label="Playback and export">
            <button class="icon-button" id="play" aria-label="Pause" data-tip="Pause" data-icon="pause"></button>
            <button class="icon-button" id="shuffle" aria-label="New arrangement" data-tip="New arrangement" data-icon="shuffle"></button>
            <button class="icon-button" id="reset" aria-label="Reset" data-tip="Reset" data-icon="rotate-ccw"></button>
            <span class="divider"></span>
            <button class="icon-button" id="save" aria-label="Save image" data-tip="Save image" data-icon="download"></button>
            <button class="icon-button" id="fullscreen" aria-label="Fullscreen" data-tip="Fullscreen" data-icon="maximize"></button>
          </div>
        </div>
      </header>

      <main id="stage" aria-label="Interactive wave field">
        <canvas id="field" role="img" aria-label="Animated interference from movable wave sources"></canvas>
        <div class="field-frame" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
        <div id="sources" role="group" aria-label="Wave sources"></div>
        <div class="field-topline" aria-hidden="true"><span>SUPERPOSITION</span><span id="field-number">FIG. 01</span></div>
        <div class="field-bottomline" aria-hidden="true"><span id="coordinates">X 0.500 / Y 0.500</span><span id="time">t + 000.00</span></div>
        <p id="notice" role="status"></p>
        <noscript><p class="no-script">JavaScript is required to render the wave field.</p></noscript>
      </main>

      <footer class="controls">
        <fieldset class="control-group view-group">
          <legend>EXPRESSION</legend>
          <div class="segments">
            <label><input type="radio" name="expression" value="0" checked><span>Contours</span></label>
            <label><input type="radio" name="expression" value="1"><span>Surface</span></label>
            <label><input type="radio" name="expression" value="2"><span>Points</span></label>
          </div>
        </fieldset>
        <div class="control-group slider-group">
          <label class="control-label" for="wavelength">WAVELENGTH <output id="wavelength-value" for="wavelength">88</output></label>
          <input id="wavelength" type="range" min="32" max="160" value="88" step="1">
        </div>
        <div class="control-group slider-group">
          <label class="control-label" for="tempo">TEMPO <output id="tempo-value" for="tempo">0.65</output></label>
          <input id="tempo" type="range" min="0" max="150" value="65" step="1">
        </div>
        <div class="control-group source-group">
          <span class="control-label">SOURCES</span>
          <div class="source-control">
            <button class="icon-button small" id="remove" aria-label="Remove selected source" data-tip="Remove selected source" data-icon="minus"></button>
            <output id="source-count" aria-live="polite">02</output>
            <button class="icon-button small" id="add" aria-label="Add source" data-tip="Add source" data-icon="plus"></button>
          </div>
        </div>
        <fieldset class="control-group palette-group">
          <legend>INK</legend>
          <div class="swatches">
            <label class="swatch tide" data-tip="Tide"><input type="radio" name="palette" value="0" aria-label="Tide palette" checked><span></span></label>
            <label class="swatch mineral" data-tip="Mineral"><input type="radio" name="palette" value="1" aria-label="Mineral palette"><span></span></label>
            <label class="swatch silver" data-tip="Silver"><input type="radio" name="palette" value="2" aria-label="Silver palette"><span></span></label>
          </div>
        </fieldset>
        <div class="control-group drift-group">
          <label for="drift" class="drift-label"><span>DRIFT</span><input type="checkbox" id="drift" role="switch"><span class="switch" aria-hidden="true"></span></label>
        </div>
      </footer>
      <div class="colophon"><span>A STUDY IN INTERFERENCE</span><span id="readout">2 OSCILLATORS / 1 FIELD</span></div>
    </div>
  </body>
</html>
