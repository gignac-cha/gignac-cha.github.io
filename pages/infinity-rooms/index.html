<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Infinity Rooms</title>
    <link rel="icon" type="image/png" href="./favicon.png" />
    <!-- 페이지 본문 폰트: Pretendard Variable (three/d3 와 동일한 jsdelivr CDN 패턴) -->
    <link rel="stylesheet" href="https://fastly.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
    <link rel="stylesheet" href="./style.scss" />
    <script type="importmap">
      {
        "imports": {
          "three": "https://fastly.jsdelivr.net/npm/three@latest/build/three.webgpu.js",
          "three/webgpu": "https://fastly.jsdelivr.net/npm/three@latest/build/three.webgpu.js",
          "d3": "https://fastly.jsdelivr.net/npm/d3@7/+esm"
        }
      }
    </script>
    <!-- 접근 추적(footprint): 엔드포인트를 먼저 심고 번들을 불러오면 로드 시 자동으로 발자국 한 번을 남깁니다.
         일반 script 는 파싱 중 즉시 실행되고 module script 는 지연 실행되므로, 이 순서만으로 "주입 후 로드"가 보장됩니다.
         번들을 script.ts 안에서 import 하지 않고 별도 태그로 두는 이유는 실패 격리입니다 — CDN 이 죽어도 페이지 본체는 그대로 뜹니다. -->
    <script>localStorage.setItem('footprint:endpoint', 'https://footprint-trail.tes-cha.workers.dev/');</script>
    <script type="module" src="https://fastly.jsdelivr.net/npm/@tes.cha/footprint/footprint.bundle.js"></script>
    <script type="module" src="./script.ts"></script>
</head>
<body>
    <div id="root"></div>
</body>
</html>
